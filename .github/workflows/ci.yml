name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# mise.toml の MOONBIT_VERSION と揃える。未固定インストールだと
# moonのバージョンドリフトでCIが壊れるため（例: moon.mod.json/is_main
# 廃止に伴う設定ファイル形式の変更）、CIとローカルで同一バージョンに
# 固定する。
env:
  MOONBIT_VERSION: "0.1.20260807"

jobs:
  test-moonbit:
    name: MoonBit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Format check
        run: cd moonbit && moon fmt --check

      - name: Run MoonBit tests
        run: cd moonbit && moon test --target wasm-gc

      - name: MoonBit Coverage Report
        uses: ./.github/actions/moonbit-coverage-report
        if: github.event_name == 'pull_request'

  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Format check (oxfmt)
        run: bun run fmt:check

      - name: Lint (oxlint)
        run: bun run lint

      - name: Type check
        run: bunx tsc -b --noEmit

      - name: Run TypeScript tests with coverage
        run: bun run test:coverage

      - name: TypeScript Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-moonbit, test-ts]
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
