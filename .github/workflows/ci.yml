name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # MoonBitはCDNの保持期間の都合でバージョンピン留めができず、CIは
  # 常にlatestを追いかける（ADR-017参照）。push/PRが無い期間にmoon側の
  # 破壊的変更（設定ファイル形式の非推奨化など）が入ると、次にPRが
  # 立った時に初めて気づくことになる。毎週mainに対して実行し早期検知する。
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  test-moonbit:
    name: MoonBit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Format check
        run: cd moonbit && moon fmt --check

      - name: Run MoonBit tests
        run: cd moonbit && moon test --target wasm-gc

      - name: MoonBit Coverage Report
        uses: ./.github/actions/moonbit-coverage-report
        if: github.event_name == 'pull_request'

  test-ts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Format check (oxfmt)
        run: bun run fmt:check

      - name: Lint (oxlint)
        run: bun run lint

      - name: Type check
        run: bunx tsc -b --noEmit

      - name: Run TypeScript tests with coverage
        run: bun run test:coverage

      - name: TypeScript Coverage Report
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        if: github.event_name == 'pull_request'

  build:
    permissions:
      contents: read
    name: Build
    runs-on: ubuntu-latest
    needs: [test-moonbit, test-ts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
